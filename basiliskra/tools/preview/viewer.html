<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Basiliskra reference viewer</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/tools/preview/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildGeometry, loadTexture, skin, makeEnv, resetPose, addPose } from './lib/bedrock.js';
import { Animator } from './lib/animator.js';
import * as Stage from './lib/stage.js';
import { makeWorldEnv } from './lib/world.js';
import { ScenePlayer } from './lib/scene.js';
import { TERRAINS } from './scenes/terrain.mjs';
import { SHOTS } from './scenes/shots.mjs';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

async function json(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  const t = await r.text();
  return JSON.parse(t.replace(/^\s*\/\/.*$/gm, ''));
}

const BK = {
  THREE, renderer, Stage, env: makeEnv(), scene: new THREE.Scene(), models: {},
  async loadForm(key, { geo, tex, glow }) {
    const g = buildGeometry(await json(geo));
    const t = await loadTexture(tex);
    const gt = glow ? await loadTexture(glow) : null;
    skin(g, t, gt, BK.env);
    g.holder = new THREE.Group();
    g.holder.add(g.root);
    g.root.scale.setScalar(1 / 16);      // model units -> blocks
    BK.scene.add(g.holder);
    BK.models[key] = g;
    return { cubes: g.cubeCount, quads: g.quadCount, bones: g.bones.size, desc: g.description };
  },
  async makeAnimator(key, files) {
    const f = {
      entity: await json(files.entity),
      animations: await Promise.all(files.animations.map(json)),
      controllers: await Promise.all(files.controllers.map(json)),
      renderControllers: await Promise.all((files.renderControllers || []).map(json)),
    };
    const m = BK.models[key];
    m.animator = new Animator(m, f, files.hooks || {});
    return [...m.animator.clips.keys()].length;
  },
  show(key) { for (const [k, m] of Object.entries(BK.models)) m.holder.visible = k === key; },
  setGlow(key, a) {
    for (const b of BK.models[key].bones.values()) if (b.glow) { b.glow.visible = a > 0; b.glow.material.uniforms.uAlpha.value = a; }
  },
  setPose(key, pose) {
    const m = BK.models[key];
    resetPose(m);
    for (const [name, p] of Object.entries(pose || {})) {
      const b = m.bones.get(name);
      if (!b) throw new Error('pose: no bone ' + name);
      addPose(b, p.rot, p.pos, p.scl);
    }
  },
  bounds(key) {
    const box = new THREE.Box3().setFromObject(BK.models[key].holder);
    return { min: box.min.toArray(), max: box.max.toArray() };
  },
  bonePos(key, name) {
    const m = BK.models[key];
    const o = m.bones.get(name)?.group || m.locators.get(name);
    if (!o) throw new Error('no bone/locator ' + name);
    m.holder.updateMatrixWorld(true);
    return o.getWorldPosition(new THREE.Vector3()).toArray();
  },
  /** One still. cam: {pos, target, fov} or {ortho: halfHeight, dir, target} */
  shot(w, h, cam, bg) {
    renderer.setSize(w, h, false);
    renderer.setClearColor(new THREE.Color(bg ?? '#8fb4e8'), 1);
    let c;
    if (cam.ortho) {
      const hh = cam.ortho, hw = hh * w / h;
      c = new THREE.OrthographicCamera(-hw, hw, hh, -hh, -2000, 4000);
      const t = new THREE.Vector3(...cam.target);
      const d = new THREE.Vector3(...cam.dir).normalize();
      c.position.copy(t).addScaledVector(d, 500);
      c.lookAt(t);
    } else {
      c = new THREE.PerspectiveCamera(cam.fov ?? 60, w / h, 0.05, 2000);
      c.position.set(...cam.pos);
      c.lookAt(new THREE.Vector3(...cam.target));
    }
    BK.camera = c;
    renderer.render(BK.scene, c);
    return renderer.domElement.toDataURL('image/png');
  },
};
makeWorldEnv(BK.env);

// ---- encounter previews: a recording of the script, replayed with the pack's own client files ----
const overlay = document.createElement('canvas');
BK.openScene = async (name, particleFiles, files) => {
  const shot = SHOTS[name];
  if (!shot) throw new Error('no shot list for ' + name);
  const replay = await json(`/build/replays/${shot.replay ?? name}.json`);
  const defs = {};
  for (const f of particleFiles) { const d = (await json(f)).particle_effect; defs[d.description.identifier] = d; }
  const sprite = await loadTexture('/packs/RP/textures/particle/basiliskra_particles.png');
  const player = new ScenePlayer(BK, replay, TERRAINS[replay.terrain], shot);
  await player.init({ form: (k) => ({ geo: files.geo.replace('%', k), tex: files.tex.replace('%', k), glow: files.glow.replace('%', k) }), client: files.client }, defs, sprite);
  BK.player = player;
  return { duration: player.duration, title: shot.title, missing: [...player.A.missing] };
};
/** Advance by dt and draw one frame; returns a JPEG data URL and where the camera was. */
BK.sceneFrame = (dt, w, h, draw = true, format = 'image/jpeg') => {
  const P = BK.player, shot = P.shot;
  P.step(dt);
  if (!draw) return null;
  if (shot.fog) { /* applied after the sky is chosen, inside render */ }
  const cam = P.render(w, h);
  overlay.width = w; overlay.height = h;
  const g = overlay.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0, w, h);
  const s = h / 720;
  g.textBaseline = 'alphabetic';
  const fade = Math.min(1, Math.max(0, 1 - (P.time - 4.2) / 0.8)) * Math.min(1, P.time / 0.5);
  if (fade > 0 && shot.title) {
    g.globalAlpha = fade;
    g.font = `600 ${Math.round(34 * s)}px Georgia, 'DejaVu Serif', serif`;
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillText(shot.title, 42 * s + 2, 70 * s + 2);
    g.fillStyle = '#f2ece4'; g.fillText(shot.title, 42 * s, 70 * s);
    if (shot.sub) { g.font = `${Math.round(17 * s)}px 'DejaVu Sans', sans-serif`; g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillText(shot.sub, 43 * s + 1, 98 * s + 1); g.fillStyle = '#e0d8cf'; g.fillText(shot.sub, 43 * s, 98 * s); }
    g.globalAlpha = 1;
  }
  for (const L of shot.labels || []) {
    if (P.time < L.from || P.time >= L.to) continue;
    const a = Math.min(1, (P.time - L.from) / 0.3, (L.to - P.time) / 0.3);
    g.globalAlpha = Math.max(0, a);
    g.font = `600 ${Math.round(22 * s)}px 'DejaVu Sans', sans-serif`;
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillText(L.text, 42 * s + 1, h - 44 * s + 1);
    g.fillStyle = '#f2ece4'; g.fillText(L.text, 42 * s, h - 44 * s);
    g.globalAlpha = 1;
  }
  g.font = `${Math.round(12.5 * s)}px 'DejaVu Sans', sans-serif`;
  const note = shot.note ?? 'Offline reference render of the shipped models, animations and particles, driven by the add-on script in a simulated world. Not in-game capture.';
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, h - 24 * s, w, 24 * s);
  g.fillStyle = 'rgba(255,255,255,0.78)'; g.fillText(note, 12 * s, h - 8 * s);
  return { url: overlay.toDataURL(format, 0.93), cam, time: P.time };
};
window.BK = BK;
window.ready = true;
</script>
</body>
</html>
